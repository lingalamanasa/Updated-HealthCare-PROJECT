<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Stackly HealthCare+</title>
    <meta name="description" content="Login to your Stackly HealthCare+ account to access your medical dashboard, appointments, and health records.">

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<!-- ================= ANIMATED BACKGROUND ================= -->

<div class="bg-animation">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<!-- ================= LOGIN CARD ================= -->

<div class="login-container">
    <div class="login-card">

        <!-- Header -->
        <div class="login-header">
            <a href="index.html" class="login-logo">
                <img src="Stackly Logo 01.webp" alt="Stackly Logo">
                <span>HealthCare+</span>
            </a>
            <h1>Welcome Back</h1>
            <p>Sign in to access your health dashboard</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>

            <!-- Email -->
            <div class="form-group" id="emailGroup">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                >
                <div class="error-message" id="emailError">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Please enter a valid email address</span>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group" id="passwordGroup">
                <i class="fa-solid fa-lock input-icon"></i>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >
                <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                    <i class="fa-solid fa-eye"></i>
                </button>
                <div class="error-message" id="passwordError">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Password must be at least 6 characters</span>
                </div>
            </div>

            <!-- Options Row -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="login-btn-submit" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <div class="btn-spinner"></div>
            </button>

        </form>

        <!-- Divider -->
        <div class="divider">or continue with</div>

        <!-- Social Login -->
        <div class="social-login">
            <button type="button" class="social-btn google" id="googleLogin">
                <i class="fa-brands fa-google"></i>
                Google
            </button>
            <button type="button" class="social-btn apple" id="appleLogin">
                <i class="fa-brands fa-apple"></i>
                Apple
            </button>
        </div>

        <!-- Signup Link -->
        <div class="signup-link">
            Don't have an account? <a href="getstarted.html">Sign Up</a>
        </div>

    </div>
</div>

<!-- ================= SUCCESS OVERLAY ================= -->

<div class="success-overlay" id="successOverlay">
    <div class="success-box">
        <div class="success-icon">
            <i class="fa-solid fa-check"></i>
        </div>
        <h2>Login Successful!</h2>
        <p>Redirecting you to your dashboard…</p>
        <a href="dashboard.html" class="primary-btn" id="goToDashboard">Go to Dashboard</a>
    </div>
</div>

<!-- ================= JAVASCRIPT ================= -->

<script>
(function () {
    'use strict';

    // DOM Elements
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('loginEmail');
    const passwordInput = document.getElementById('loginPassword');
    const emailGroup = document.getElementById('emailGroup');
    const passwordGroup = document.getElementById('passwordGroup');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const toggleBtn = document.getElementById('togglePassword');
    const loginBtn = document.getElementById('loginBtn');
    const successOverlay = document.getElementById('successOverlay');

    // Email regex
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // Toggle password visibility
    toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        this.querySelector('i').className = isPassword
            ? 'fa-solid fa-eye-slash'
            : 'fa-solid fa-eye';
    });

    // Clear error on input
    emailInput.addEventListener('input', function () {
        if (emailGroup.classList.contains('error')) {
            emailGroup.classList.remove('error');
            emailError.classList.remove('show');
        }
    });

    passwordInput.addEventListener('input', function () {
        if (passwordGroup.classList.contains('error')) {
            passwordGroup.classList.remove('error');
            passwordError.classList.remove('show');
        }
    });

    // Validate email
    function validateEmail() {
        const val = emailInput.value.trim();
        if (!val || !emailRegex.test(val)) {
            emailGroup.classList.add('error');
            emailError.classList.add('show');
            return false;
        }
        return true;
    }

    // Validate password
    function validatePassword() {
        const val = passwordInput.value;
        if (!val || val.length < 6) {
            passwordGroup.classList.add('error');
            passwordError.classList.add('show');
            return false;
        }
        return true;
    }

    // Form submit
    form.addEventListener('submit', function (e) {
        e.preventDefault();

        const isEmailValid = validateEmail();
        const isPasswordValid = validatePassword();

        if (!isEmailValid || !isPasswordValid) return;

        // Show loading state
        loginBtn.classList.add('loading');

        // Simulate API call
        setTimeout(function () {
            loginBtn.classList.remove('loading');
            successOverlay.classList.add('show');

            // Auto redirect after 2 seconds
            setTimeout(function () {
                window.location.href = 'dashboard.html';
            }, 2500);
        }, 1500);
    });

    // Close success overlay on clicking Go to Dashboard
    document.getElementById('goToDashboard').addEventListener('click', function (e) {
        e.preventDefault();
        window.location.href = 'dashboard.html';
    });

})();
</script>

</body>
</html>
